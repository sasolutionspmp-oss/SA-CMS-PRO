pid /tmp/cipher-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  types { application/javascript mjs; }
  default_type application/octet-stream;
  access_log /dev/stdout;
  client_body_temp_path /tmp/cipher-client-body;
  proxy_temp_path /tmp/cipher-proxy;
  fastcgi_temp_path /tmp/cipher-fastcgi;
  uwsgi_temp_path /tmp/cipher-uwsgi;
  scgi_temp_path /tmp/cipher-scgi;
  server {
    listen 8080;
    server_name _;
    root /opt/cipher/product/dist;
    client_max_body_size 26m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    location /api/ {
      proxy_set_header Host cipher.localhost;
      proxy_set_header X-Frappe-Site-Name cipher.localhost;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 120s;
      proxy_pass http://127.0.0.1:8000;
    }
    location /private/ {
      proxy_set_header Host cipher.localhost;
      proxy_set_header X-Frappe-Site-Name cipher.localhost;
      proxy_pass http://127.0.0.1:8000;
    }
    location /socket.io {
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection upgrade;
      proxy_set_header Host cipher.localhost;
      proxy_pass http://127.0.0.1:9000;
    }
    location / { try_files $uri $uri/ /index.html; }
  }
}
