name: Cipher new stack

on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/cipher/platform/**
      - apps/cipher/product/**
      - .github/workflows/cipher-new-stack.yml

permissions:
  contents: read

jobs:
  fresh-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/cipher/platform
            apps/cipher/product
            .github/workflows
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.0
      - name: Configure isolated synthetic dependencies
        run: |
          python - <<'PY'
          import json, os, secrets
          from pathlib import Path
          deployment = Path('apps/cipher/platform/deployment')
          lock = json.loads(Path('apps/cipher/platform/versions.lock.json').read_text())
          values = {'CIPHER_DB_ROOT_PASSWORD': secrets.token_urlsafe(32),
                    'CIPHER_ADMIN_PASSWORD': secrets.token_urlsafe(32),
                    'CIPHER_RUNTIME_IMAGE': lock['runtime']['upstream_image']}
          path = deployment / '.env.ci'
          path.write_text(''.join(key + '=' + value + '\n' for key, value in values.items()))
          path.chmod(0o600)
          PY
          # The upstream image runs as UID 1000; hosted checkout files use 1001.
          # Editable metadata must be writable in this one app bind mount.
          sudo chown -R 1000:1000 apps/cipher/platform/apps/cipher_aec
          cd apps/cipher/platform/deployment
          ./docker-local.sh compose --env-file .env.ci -f compose.dev.yml pull
          ./docker-local.sh compose --env-file .env.ci -f compose.dev.yml up -d
          python - <<'PY'
          import json, subprocess, time
          for service in ('db', 'redis'):
              deadline = time.monotonic() + 180
              while True:
                  raw = subprocess.check_output(['./docker-local.sh', 'inspect', 'cipher-r0-' + service + '-1'])
                  state = json.loads(raw)[0]['State']
                  if state.get('Health', {}).get('Status') == 'healthy':
                      break
                  if time.monotonic() >= deadline:
                      raise SystemExit(service + ' did not become healthy')
                  time.sleep(1)
          PY
          ./docker-local.sh exec cipher-r0-runtime-1 bash -euo pipefail -c '
            cd /home/frappe/frappe-bench
            bench set-config -g db_host db
            bench set-config -gp db_port 3306
            bench set-config -g redis_cache redis://redis:6379/0
            bench set-config -g redis_queue redis://redis:6379/1
            bench set-config -g redis_socketio redis://redis:6379/2
          '
      - name: Validate fresh application and isolated client build
        run: |
          python apps/cipher/platform/operations/validate_new_stack.py \
            --extended-fixtures --install-browser \
            --output apps/cipher/docs/framework/evidence/ci/new-stack-validation.json
      - name: Upload reviewed-shape validation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cipher-new-stack-validation
          path: apps/cipher/docs/framework/evidence/ci/new-stack-validation.json
          if-no-files-found: warn
